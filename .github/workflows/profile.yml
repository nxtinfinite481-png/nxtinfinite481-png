name: Update Profile

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate GitHub Stats
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=nxtinfinite481-png&show_icons=true&hide_border=true&theme=tokyonight&rank_icon=github
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Top Languages
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=nxtinfinite481-png&layout=compact&hide_border=true&theme=tokyonight&langs_count=8
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Contribution Snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: nxtinfinite481-png
          outputs: |
            dist/github-snake.svg?palette=github-dark&color_snake=#22D3EE

      - name: Commit generated files
        uses: EndBug/add-and-commit@v9
        with:
          message: "chore: update profile stats"
          add: "profile/*.svg dist/github-snake.svg"
