<svg width="1200" height="350" viewBox="0 0 1200 350" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>

    <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="350" rx="18" fill="url(#bg)"/>

  <rect x="30" y="30" width="1140" height="290" rx="14"
        fill="#080d17"
        stroke="#1e293b"
        stroke-width="2"/>

  <!-- Terminal header -->
  <circle cx="60" cy="62" r="7" fill="#ef4444"/>
  <circle cx="84" cy="62" r="7" fill="#eab308"/>
  <circle cx="108" cy="62" r="7" fill="#22c55e"/>

  <text x="140" y="68"
        fill="#64748b"
        font-family="monospace"
        font-size="16">
    infinite@labs: ~
  </text>

  <!-- Terminal content -->
  <text x="70" y="125"
        fill="#22d3ee"
        font-family="monospace"
        font-size="20">
    $ whoami
  </text>

  <text x="70" y="158"
        fill="#ffffff"
        font-family="monospace"
        font-size="30"
        font-weight="bold">
    INFINITE
  </text>

  <text x="70" y="195"
        fill="#94a3b8"
        font-family="monospace"
        font-size="18">
    Founder of INFINITE LABS
  </text>

  <text x="70" y="235"
        fill="#22d3ee"
        font-family="monospace"
        font-size="20">
    $ cat skills.txt
  </text>

  <text x="70" y="268"
        fill="#e2e8f0"
        font-family="monospace"
        font-size="17">
    VPS • Servers • Hosting • Linux • Automation
  </text>

  <text x="70" y="300"
        fill="#22c55e"
        font-family="monospace"
        font-size="16">
    ● fast learner • always building
  </text>

  <!-- Decorative code -->
  <text x="900" y="130"
        fill="#1e3a5f"
        font-family="monospace"
        font-size="18">
    &lt;server&gt;
  </text>

  <text x="930" y="165"
        fill="#164e63"
        font-family="monospace"
        font-size="18">
    infrastructure
  </text>

  <text x="950" y="200"
        fill="#1e3a5f"
        font-family="monospace"
        font-size="18">
    automation
  </text>

  <text x="930" y="235"
        fill="#164e63"
        font-family="monospace"
        font-size="18">
    hosting
  </text>

  <text x="900" y="270"
        fill="#1e3a5f"
        font-family="monospace"
        font-size="18">
    &lt;/server&gt;
  </text>

  <!-- Accent line -->
  <rect x="70" y="315" width="1060" height="2" fill="url(#cyan)" opacity="0.7"/>
</svg>
